services:
  redis:
    image: redis:7-alpine
    container_name: sangita-redis
    command: redis-server --appendonly yes
    volumes:
      - ./redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  sangita:
    build: .
    container_name: sangita-backend
    expose:
      - "5000"
    volumes:
      - ./music:/app/music
      - ./data:/app/data
    environment:
      - MUSIC_DIR=/app/music
      - SANGITA_USER=${SANGITA_USER:-admin}
      - SANGITA_PASS=${SANGITA_PASS:?Set SANGITA_PASS in .env}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - SYNC_SERVER_URL=http://sync-server:3001
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  sync-server:
    build: ./sync-server
    container_name: sangita-sync-server
    expose:
      - "3001"
    volumes:
      - ./data:/app/data:ro
    environment:
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - REDIS_URL=redis://redis:6379
      - SYNC_PORT=3001
      - CORS_ORIGIN=*
    depends_on:
      - redis
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    container_name: sangita-proxy
    ports:
      - "${PORT:-5000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      sangita:
        condition: service_healthy
      sync-server:
        condition: service_started
    restart: unless-stopped
