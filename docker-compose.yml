services:
  redis:
    image: redis:7-alpine
    container_name: sangita-redis
    command: redis-server --appendonly yes
    volumes:
      - ./redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  sangita:
    build: .
    container_name: sangita-backend
    expose:
      - "5000"
    volumes:
      - ./music:/app/music
    environment:
      - MUSIC_DIR=/app/music
      - SANGITA_USER=${SANGITA_USER:-admin}
      - SANGITA_PASS=${SANGITA_PASS:-sangita123}
      - SECRET_KEY=${SECRET_KEY:-change-this-secret}
      - SYNC_SERVER_URL=http://sync-server:3001
    depends_on:
      - redis
    restart: unless-stopped

  sync-server:
    image: node:20-alpine
    container_name: sangita-sync-server
    working_dir: /app
    volumes:
      - ./sync-server:/app
    expose:
      - "3001"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-this-secret}
      - REDIS_URL=redis://redis:6379
      - SYNC_PORT=3001
      - CORS_ORIGIN=*
    command: sh -c "npm install && npm start"
    depends_on:
      - redis
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    container_name: sangita-proxy
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sangita
      - sync-server
    restart: unless-stopped
