<?xml version="1.0" encoding="UTF-8"?>
<svg id="sangitaLogoSvg" xmlns="http://www.w3.org/2000/svg" viewBox="20 -25 440 440" width="100%" height="100%" fill="currentColor">
    <style>
        :root { color: #34D399; }
        @media (prefers-color-scheme: light) {
            :root { color: #059669; }
        }
    </style>
    <!-- 1. PLAY TRIANGLE + MORSE SOUNDWAVE MARK (Auto-centered with Gap) -->
    <g id="markGroup" transform="translate(2.5, 0)">
        <!-- Rounded-Corner Minimalist Play Button Outline (Right tip at X=197) -->
        <path id="playTrianglePath" d="M 62,102 C 62,78 82,68 102,80 L 185,165 C 201,176 201,194 185,205 L 102,290 C 82,302 62,292 62,268 Z" fill="none" stroke="currentColor" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>

        <!-- 12-Column Morse Code Soundwave (Shifted right for clean visual gap) -->
        <g id="morseWaveGroup" transform="translate(22, 0)">
            <!-- Col 1 (x=218) -->
            <rect x="213" y="170" width="10" height="30" rx="5"/>

            <!-- Col 2 (x=234) -->
            <circle cx="234" cy="152" r="5"/>
            <rect x="229" y="168" width="10" height="34" rx="5"/>
            <circle cx="234" cy="218" r="5"/>

